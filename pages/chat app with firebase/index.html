<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatFlow - Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <!-- Logo -->
        <div class="logo">

    <div class="logo-icon">

        <svg width="68" height="68" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

            <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#2493ff"/>
                    <stop offset="100%" stop-color="#1456ff"/>
                </linearGradient>

                <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#7ed8ff"/>
                    <stop offset="100%" stop-color="#ffffff"/>
                </linearGradient>
            </defs>

            <rect width="64" height="64" rx="16" fill="url(#bg)"/>

            <path
                d="M18 17h28c5 0 9 4 9 9v8c0 5-4 9-9 9H35L24 52v-9h-6c-5 0-9-4-9-9v-8c0-5 4-9 9-9z"
                fill="white"/>

            <circle cx="24" cy="30" r="2.3" fill="#1456ff"/>
            <circle cx="32" cy="30" r="2.3" fill="#1456ff"/>
            <circle cx="40" cy="30" r="2.3" fill="#1456ff"/>

            <path
                d="M14 39c8-6 19-5 28 0s15 5 22-1c-3 9-10 14-19 14H22c-5 0-8-5-8-13z"
                fill="url(#wave)"
                opacity=".95"/>
        </svg>

    </div>

    <div class="brand">

        <h1>ChatFlow</h1>

        <p>CONNECT. CHAT. FLOW.</p>

    </div>

</div>
        <h2 class="acount">Create your account</h2>

        <p class="subtitle">
            Connect with friends anytime, anywhere.
        </p>

        <form id="form">

            <div class="row">

                <div class="inputBox">
                    <input type="text" id="firstname" required>
                    <label>First Name</label>
                </div>

                <div class="inputBox">
                    <input type="text" id="lastname" required>
                    <label>Last Name</label>
                </div>

            </div>

            <div class="inputBox">
                <input type="text" id="username" required>
                <label>Username</label>
            </div>

            <div class="inputBox">
                <input type="email" id="email-inp" required>
                <label>Email Address</label>
            </div>

            <div class="inputBox">
                <input type="password" id="password-inp" required>
                <label>Password</label>
            </div>

            <button id="register">
                Create Account
            </button>
<br>
<br>
           <button id="google-btn" type="button" class="submit-btn signin">
  <img
    src="./assets/image/ChatGPT Image Jun 17, 2026, 09_58_13 AM.png"
    alt="Google"
    class="Gimg"
  >
   Continue with Google
</button>

            <div class="message-area">
                <span id="message"></span>
            </div>

            <div class="bottom">

                <span>
                    Already have an account?
                </span>

                <a href="./login.html">
                    Sign In
                </a>

            </div>

        </form>

    </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
