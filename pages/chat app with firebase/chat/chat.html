<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatFlow</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>

<div class="container">

    <!-- Left Sidebar -->
    <div class="sidebar">

        <div class="sidebar-header">
            <div class="my-avatar-icon">
                <svg viewBox="0 0 212 212" width="24" height="24"><path fill="#fff" d="M106.251,0.5c-58.633,0-106,47.373-106,106.002c0,58.626,47.367,105.998,106,105.998s106-47.372,106-105.998C212.251,47.873,164.884,0.5,106.251,0.5z M106.251,55.5c17.667,0,32,14.331,32,32.001c0,17.669-14.333,32-32,32s-32-14.331-32-32C74.251,69.831,88.584,55.5,106.251,55.5z M106.377,168.75c-21.176,0-40.026-9.876-52.226-25.263c0.253-16.774,34.813-25.987,52.226-25.987c17.324,0,51.973,9.213,52.226,25.987C146.402,158.874,127.552,168.75,106.377,168.75z"/></svg>
            </div>
            <h2>ChatFlow</h2>
        </div>

        <div class="search-wrap">
            <div class="search-pill">
                <svg viewBox="0 0 24 24" width="16" height="16"><path fill="#8696a0" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.494 4.494 0 0 1 9.5 14z"/></svg>
                <input type="text" placeholder="Search or start new chat">
            </div>
        </div>

        <div id="usersdiv" class="users-list">

            <!-- User -->
            <!-- JS yahan cards add karega -->

        </div>

    </div>

    <!-- Right Chat -->

    <div class="chat-section">

        <div class="chat-header">

            <h2 id="usenameselected">Select a User</h2>

            <div>
                <button id="logoutBtn">Logout</button>
                <button id="delete">Delete</button>
            </div>

        </div>
        <div id="chatdiv" class="chat-body">



        </div>

        <div class="chat-footer">

            <input
                id="messageInput"
                type="text"
                placeholder="Type a message..."
            >

            <button id="sendBtn">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M1.101 21.757L23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"/></svg>
            </button>

        </div>

    </div>

</div>

<script type="module" src="chat.js"></script>

</body>
</html>
