<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="form-container">

    <h1>Create Account</h1>

    <form id="register-form">

      <div class="input-group">
        <input
          type="email"
          id="email-inp"
          placeholder="Enter your email"
        >
      </div>

      <div class="input-group">
        <input
          type="password"
          id="pass-inp"
          placeholder="Enter your password"
        >
      </div>

      <div class="input-group">
        <input
          type="submit"
          value="register"
          class="submit-btn"
        >
      </div>

      <div class="input-group">
        <button
          type="button"
          id="sign-in"
          class="submit-btn signin btn"
        >
         log in
        </button>
       <button id="google-btn" type="button" class="submit-btn signin">
  Continue with Google
  <img
    src="./assets/images/ChatGPT Image Jun 17, 2026, 09_58_13 AM.png"
    alt="Google"
    class="Gimg"
  >
</button>
      </div>

    </form>

    <p id="message"></p>

  </div>

  <script type="module" src="./app.js"></script>

</body>
</html>
